name: Bug report
description: Report a bug or problem with this addon
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to the SMG issue tracker
        You are reporting a bug in SMG (SimpleMaterialGenerators).
        Please read [this article](https://github.com/Slimefun/Slimefun4/wiki/How-to-report-bugs) first to learn how to report a bug properly.

        <strong><i>Fields marked with an asterisk (*) are required.</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Before reporting, please confirm that
      options:
        - label: You are using an unmodified build of this addon
          required: true
        - label: You are using the latest Slimefun build
          required: true
        - label: You have searched the [existing issues](https://github.com/mybezo/SMG/issues) and found no duplicate
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the problem in detail.
        Detailed information helps us fix it faster.
      placeholder: Just saying "it doesn't work" does not help us find the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Describe exactly how to reproduce the problem.
        If you have a video, link it here.
      placeholder: |
        1. xxx
        2. xxx
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: |
        What did you expect to happen?
        Sometimes the cause is a misunderstanding of how a feature works.
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: Server log
      description: |
        Check whether your server log contains any errors. If it does, upload it to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the log directly here.**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: Error report
      description: |
        If the server log mentions a file in `/plugins/Slimefun/error-reports` (an error report),
        upload it to [https://mclo.gs](https://mclo.gs) and paste the link here.
        **Do not paste the error report directly here.**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Run `/sf versions` in game and paste or screenshot the **full output** here.
        If the command does not work, list your server software, Minecraft server version, Slimefun version, this addon's version and your plugin list.
        If your client's Minecraft version differs from the server's, mention that too.
      placeholder: |
        (Paste the full output of /sf versions here, or fill it in manually)
    validations:
      required: true
