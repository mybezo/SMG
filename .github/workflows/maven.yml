name: Java CI

on:
  push:
    branches:
    - '**'
  workflow_dispatch:
  pull_request:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
      - name: Build with Maven
        run: mvn package --file pom.xml
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SimpleMaterialGenerators
          path: target/SimpleMaterialGenerators-*.jar
          if-no-files-found: error
